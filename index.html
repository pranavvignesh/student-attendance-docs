<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Attendance Management System</title>
<style>
:root {
  --ink:#1e1b3a; --muted:#6b6a85; --bg:#f1f0fb; --card:#fff; --line:#e4e2f5;
  --violet:#6c4df6; --teal:#14b8a6; --green:#22a559; --red:#ef476f; --amber:#ffa62b;
}
* { box-sizing:border-box; margin:0; }
body { font-family:"Segoe UI",system-ui,Arial,sans-serif; color:var(--ink); background:var(--bg); display:flex; min-height:100vh; }

/* Sidebar */
aside { width:240px; padding:24px 16px; color:#fff; flex-shrink:0;
  background:linear-gradient(170deg,var(--violet),#3b82f6 55%,var(--teal)); }
.logo { font-size:22px; font-weight:700; margin-bottom:28px; padding-left:8px; }
nav button { display:flex; gap:10px; align-items:center; width:100%; padding:12px 14px; margin-bottom:8px;
  border:0; border-radius:10px; background:rgba(255,255,255,.14); color:#fff; font-size:15px; cursor:pointer; transition:.2s; }
nav button:hover { background:rgba(255,255,255,.28); transform:translateX(4px); }
nav button.active { background:#fff; color:var(--violet); font-weight:600; }

/* Main */
main { flex:1; padding:28px; min-width:0; }
h2 { font-size:22px; margin-bottom:16px; }
.stats { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px; }
.stat { color:#fff; border-radius:14px; padding:18px; text-align:center; box-shadow:0 6px 16px rgba(30,27,58,.15); }
.stat b { display:block; font-size:34px; line-height:1.1; }
.stat span { font-size:14px; opacity:.92; }
.stat:nth-child(1){background:linear-gradient(135deg,#6c4df6,#8f7bff)}
.stat:nth-child(2){background:linear-gradient(135deg,#1c9c52,#46d17f)}
.stat:nth-child(3){background:linear-gradient(135deg,#ef476f,#ff7a95)}
.stat:nth-child(4){background:linear-gradient(135deg,#ff8c1a,#ffc14d)}

.panel { display:none; background:var(--card); border-radius:14px; padding:22px; box-shadow:0 6px 16px rgba(30,27,58,.08); }
.panel.show { display:block; }
.row { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:6px; }
input { flex:1; min-width:150px; padding:11px 14px; border:2px solid var(--line); border-radius:10px; font-size:15px; outline:0; transition:.2s; }
input:focus { border-color:var(--violet); }
.btn { padding:10px 18px; border:0; border-radius:10px; color:#fff; font-size:15px; cursor:pointer; background:var(--violet); transition:.2s; }
.btn:hover { filter:brightness(1.1); transform:translateY(-2px); }
.btn.sm { padding:6px 12px; font-size:14px; }
.green{background:var(--green)} .red{background:var(--red)} .teal{background:var(--teal)}
.msg { min-height:22px; margin:6px 0; font-size:14px; color:var(--muted); }

/* Table */
.wrap { overflow-x:auto; }
table { width:100%; border-collapse:collapse; }
th { text-align:left; padding:10px 8px; font-size:14px; color:var(--muted); border-bottom:2px solid var(--line); }
td { padding:10px 8px; border-bottom:1px solid var(--line); }
tbody tr:hover { background:#f8f7ff; }
.who { display:flex; align-items:center; gap:10px; }
.av { width:36px; height:36px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-size:14px; }
.tag { padding:4px 12px; border-radius:20px; font-size:13px; color:#fff; }
.Present{background:var(--green)} .Absent{background:var(--red)} .Not-marked{background:var(--amber)}
.empty { text-align:center; color:var(--muted); padding:24px 0; }

/* Report */
.bar { height:16px; background:var(--line); border-radius:10px; overflow:hidden; margin:14px 0; }
.bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--green)); transition:width .5s; }

@media (max-width:760px) {
  body { flex-direction:column; }
  aside { width:100%; padding:14px; }
  .logo { margin-bottom:12px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; }
  nav button { width:auto; margin:0; padding:8px 12px; font-size:14px; }
  main { padding:16px; }
  .stats { grid-template-columns:repeat(2,1fr); }
}
@media print { aside, .row, .btn { display:none; } }
</style>
</head>
<body>

<aside>
  <div class="logo">🎓 Attendance</div>
  <nav>
    <button class="active" data-tab="register">📝 Register Student</button>
    <button data-tab="mark">✅ Mark Attendance</button>
    <button data-tab="view">🔍 View Attendance</button>
    <button data-tab="report">📊 Generate Report</button>
  </nav>
</aside>

<main>
  <h2>Today at a glance</h2>
  <div class="stats">
    <div class="stat"><b id="sTotal">0</b><span>Total students</span></div>
    <div class="stat"><b id="sPresent">0</b><span>Present</span></div>
    <div class="stat"><b id="sAbsent">0</b><span>Absent</span></div>
    <div class="stat"><b id="sNot">0</b><span>Not marked</span></div>
  </div>

  <section class="panel show" id="register">
    <h2>Register student</h2>
    <div class="row">
      <input id="name" placeholder="Student name">
      <input id="roll" placeholder="Roll number">
      <button class="btn" id="add">Add student</button>
    </div>
    <p class="msg" id="msg"></p>
    <div class="wrap"><table><thead><tr><th>Student</th><th>Roll no.</th><th></th></tr></thead><tbody data-list="register"></tbody></table></div>
  </section>

  <section class="panel" id="mark">
    <h2>Mark attendance</h2>
    <div class="row"><button class="btn green" data-all="Present">Mark all present</button><button class="btn teal" data-all="Not marked">Clear all</button></div>
    <div class="wrap"><table><thead><tr><th>Student</th><th>Roll no.</th><th>Mark as</th></tr></thead><tbody data-list="mark"></tbody></table></div>
  </section>

  <section class="panel" id="view">
    <h2>View attendance</h2>
    <div class="row"><input id="search" placeholder="Search by name or roll number"></div>
    <div class="wrap"><table><thead><tr><th>Student</th><th>Roll no.</th><th>Status today</th></tr></thead><tbody data-list="view"></tbody></table></div>
  </section>

  <section class="panel" id="report">
    <h2>Attendance report</h2>
    <p id="reportText"></p>
    <div class="bar"><i id="bar"></i></div>
    <div class="row"><button class="btn" id="print">Print report</button><button class="btn red" id="reset">Reset all data</button></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let students = [];
try { students = JSON.parse(localStorage.getItem("students")) || []; } catch (e) {}

const colors = ["#6c4df6", "#14b8a6", "#ef476f", "#ff8c1a", "#3b82f6", "#22a559"];
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const who = (s, i) => `<div class="who"><span class="av" style="background:${colors[i % 6]}">${esc(s.name[0].toUpperCase())}</span>${esc(s.name)}</div>`;
const tag = s => `<span class="tag ${s.replace(" ", "-")}">${s}</span>`;
const count = st => students.filter(s => s.status === st).length;

const rows = {
  register: (s, i) => `<td>${who(s, i)}</td><td>${esc(s.roll)}</td><td><button class="btn sm red" data-act="remove" data-i="${i}">Remove</button></td>`,
  mark: (s, i) => `<td>${who(s, i)}</td><td>${esc(s.roll)}</td><td><button class="btn sm green" data-act="Present" data-i="${i}">Present</button> <button class="btn sm red" data-act="Absent" data-i="${i}">Absent</button></td>`,
  view: (s, i) => `<td>${who(s, i)}</td><td>${esc(s.roll)}</td><td>${tag(s.status)}</td>`
};

function render() {
  localStorage.setItem("students", JSON.stringify(students));
  const p = count("Present"), a = count("Absent"), n = students.length;
  [n, p, a, n - p - a].forEach((v, i) => document.querySelectorAll(".stat b")[i].textContent = v);

  const q = $("search").value.toLowerCase();
  document.querySelectorAll("[data-list]").forEach(tb => {
    const type = tb.dataset.list;
    const html = students.map((s, i) => ({ s, i }))
      .filter(({ s }) => type !== "view" || (s.name + s.roll).toLowerCase().includes(q))
      .map(({ s, i }) => `<tr>${rows[type](s, i)}</tr>`).join("");
    tb.innerHTML = html || `<tr><td colspan="3" class="empty">No students to show yet.</td></tr>`;
  });

  const pct = n ? Math.round(p / n * 100) : 0;
  $("bar").style.width = pct + "%";
  $("reportText").textContent = n
    ? `${p} of ${n} students are present today (${pct}%). ${a} absent, ${n - p - a} not marked.`
    : "No data yet. Register students and mark attendance first.";
}

$("add").onclick = () => {
  const name = $("name").value.trim(), roll = $("roll").value.trim();
  if (!name || !roll) return $("msg").textContent = "⚠️ Enter both a name and a roll number.";
  if (students.some(s => s.roll === roll)) return $("msg").textContent = "⚠️ That roll number is already registered.";
  students.push({ name, roll, status: "Not marked" });
  $("name").value = $("roll").value = "";
  $("msg").textContent = "✅ Student added.";
  render();
};

document.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.tab) {
    document.querySelectorAll("nav button, .panel").forEach(x => x.classList.remove("active", "show"));
    b.classList.add("active");
    $(b.dataset.tab).classList.add("show");
  } else if (b.dataset.act === "remove") { students.splice(b.dataset.i, 1); render(); }
  else if (b.dataset.act) { students[b.dataset.i].status = b.dataset.act; render(); }
  else if (b.dataset.all) { students.forEach(s => s.status = b.dataset.all); render(); }
});

$("search").oninput = render;
$("print").onclick = () => window.print();
$("reset").onclick = () => { if (confirm("Delete all students?")) { students = []; render(); } };
render();
</script>
</body>
</html>
